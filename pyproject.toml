[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntk-ml"
version = "1.0.12"
readme = "README.md"
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
description = "A from-scratch neural network and tensor library built in Python for learning, experimentation, and deep understanding of modern ML systems."
authors = [{ name="Chike Ikefuama"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.3.1",
    "matplotlib>=3.10.3",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/Chike-Codes/neuraltoolkit"
Repository = "https://github.com/Chike-Codes/neuraltoolkit"
Issues = "https://github.com/Chike-Codes/neuraltoolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
